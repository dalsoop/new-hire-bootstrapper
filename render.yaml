databases:
  - name: newhirebootstrapperdb
    region: frankfurt
    databaseName: newhirebootstrapperdb
    ipAllowList: []

services:
  - type: web
    name: new-hire-bootstrapper
    region: frankfurt
    env: docker
    dockerfilePath: ./back/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newhirebootstrapperdb
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        generateValue: true

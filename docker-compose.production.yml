name: new-hire-bootstrapper

services:
  db:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: new-hire-bootstrapper-db
    restart: unless-stopped
    env_file:
      - path: database.env
        format: raw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - new-hire-bootstrapper-postgres:/var/lib/postgresql/data
    networks:
      - new-hire-bootstrapper

  web:
    image: ${NEW_HIRE_BOOTSTRAPPER_IMAGE:-new-hire-bootstrapper:2.5.0-ranode.3}
    container_name: new-hire-bootstrapper-app
    restart: unless-stopped
    env_file:
      - path: runtime.env
        format: raw
    ports:
      - "127.0.0.1:8888:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-hire-bootstrapper

volumes:
  new-hire-bootstrapper-postgres:
    external: true

networks:
  new-hire-bootstrapper:
    external: true
